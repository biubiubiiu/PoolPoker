name: poolpoker
options:
  bundleIdPrefix: com.poolpoker.app
  deploymentTarget:
    iOS: 16.0
fileGroups: [../src]
configs:
  debug: debug
  release: release
configFiles:
  debug: Config.xcconfig
  release: Config.xcconfig
settingGroups:
  app:
    base:
      PRODUCT_NAME: PoolPoker
      PRODUCT_BUNDLE_IDENTIFIER: com.poolpoker.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  poolpoker_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared/RoomCredential.swift
      - path: Assets.xcassets
      - path: Externals
      - path: poolpoker_iOS
      - path: assets
        buildPhase: resources
        type: folder
    info:
      path: poolpoker_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackgroundColor
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: PoolPoker 需要访问局域网以连接开发服务器与游戏房间。
        NSBluetoothAlwaysUsageDescription: PoolPoker 需要使用蓝牙进行面对面离线卡牌对局与桌台扫描联机。
        NSBluetoothPeripheralUsageDescription: PoolPoker 需要使用蓝牙作为房主外设发起离线面对面对决。
        NSBonjourServices:
          - _http._tcp.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: TaoScene
                UISceneDelegateClassName: TaoSceneDelegate
    entitlements:
      path: poolpoker_iOS/poolpoker_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Shared/Simulator.entitlements
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/$(PLATFORM_NAME)/$(CONFIGURATION) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          if [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi

          NVMRC_VER=$(tr -d '[:space:]' < "$SRCROOT/../.nvmrc" 2>/dev/null || true)
          if [ -n "$NVMRC_VER" ] && [ -d "$HOME/.nvm/versions/node/v${NVMRC_VER#v}/bin" ]; then
            NVM_BIN="$HOME/.nvm/versions/node/v${NVMRC_VER#v}/bin"
          elif [ -d "$HOME/.nvm/versions/node" ]; then
            NVM_BIN="$HOME/.nvm/versions/node/$(ls "$HOME/.nvm/versions/node" 2>/dev/null | tail -n 1)/bin"
          else
            NVM_BIN=""
          fi
          export PATH="$HOME/.cargo/bin:$NVM_BIN:$HOME/Library/pnpm/bin:$HOME/.local/share/pnpm:/opt/homebrew/bin:/usr/local/bin:$PATH"

          if [[ "${SDKROOT:-}" == *Simulator* ]] || [ "${PLATFORM_NAME:-}" = "iphonesimulator" ]; then
            if [ "${ARCHS:-}" = "x86_64" ] || [ "${CURRENT_ARCH:-}" = "x86_64" ]; then
              RUST_TARGET="x86_64-apple-ios"
            else
              RUST_TARGET="aarch64-apple-ios-sim"
            fi
          else
            RUST_TARGET="aarch64-apple-ios"
          fi

          TARGET_DIR="$SRCROOT/Externals/${PLATFORM_NAME}/${CONFIGURATION}"
          mkdir -p "$TARGET_DIR"

          if ! command -v pnpm >/dev/null 2>&1; then
            echo "error: [PoolPoker iOS] 未检测到 pnpm 工具。iOS 客户端构建依赖 Node.js (>=24) 及 pnpm (>=12.6)。请确保已安装并在 PATH 中配置（如执行 corepack enable 或 brew install pnpm）。" >&2
            exit 1
          fi

          if [ "${POOLPOKER_OFFLINE:-1}" = "0" ]; then
            echo "=== [PoolPoker] Mode: Live Dev Server (localhost:5173, target: $RUST_TARGET) ==="
            if ! pnpm tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}; then
              if [ -f "$TARGET_DIR/libapp.a" ] || [ -f "$SRCROOT/Externals/arm64/${CONFIGURATION}/libapp.a" ]; then
                echo "warning: [PoolPoker iOS] Tauri CLI dev server 未运行，回退使用已存在的 libapp.a 静态库。"
                exit 0
              else
                echo "error: [PoolPoker iOS] Tauri CLI 开发服务未运行，且未找到现存 libapp.a 静态库。" >&2
                echo "error: [PoolPoker iOS] 解决方案：" >&2
                echo "error:   1. 在终端运行 'pnpm exec tauri ios dev' 启动开发服务；或" >&2
                echo "error:   2. 采用默认离线单机模式编译（环境变量 POOLPOKER_OFFLINE=1）。" >&2
                exit 1
              fi
            fi
          else
            echo "=== [PoolPoker] Mode: Offline Standalone (Embedded dist, target: $RUST_TARGET) ==="

            if ! command -v cargo >/dev/null 2>&1; then
              echo "error: [PoolPoker iOS] 未检测到 Rust 工具链 (cargo 未安装或不在 PATH 中)。" >&2
              echo "error: [PoolPoker iOS] iOS 宿主应用基于 Tauri v2 离线架构，必须使用 Rust 编译底层静态库 libapp.a。" >&2
              echo "error: [PoolPoker iOS] 解决方案：" >&2
              echo "error:   1. 安装 Rust 环境: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh" >&2
              echo "error:   2. 添加 iOS 架构目标: rustup target add ${RUST_TARGET}" >&2
              echo "error:   3. （提示）若您只想调试 Apple Watch 手表端，请在 Xcode 顶部 Scheme 切换为 'poolpoker_watchOS'，无需 Rust 环境即可直接编译运行。" >&2
              exit 1
            fi

            if command -v rustup >/dev/null 2>&1; then
              if ! rustup target list --installed | grep -q "^${RUST_TARGET}$"; then
                echo "error: [PoolPoker iOS] Rust 未安装当前构建所需的编译目标: ${RUST_TARGET}。" >&2
                echo "error: [PoolPoker iOS] 解决方案：在终端执行 'rustup target add ${RUST_TARGET}' 后重新编译。" >&2
                exit 1
              fi
            fi

            # Directory mtimes do not track edits to existing source files.
            # Always refresh the frontend, then let Cargo track embedded assets.
            echo "Building web frontend dist..."
            if ! (cd "$SRCROOT/.." && pnpm run build); then
              echo "error: [PoolPoker iOS] 前端打包失败 (pnpm run build)，无法生成嵌入式 web 资源。" >&2
              exit 1
            fi

            TARGET_LIB="$TARGET_DIR/libapp.a"
            CARGO_LIB="$SRCROOT/../src-tauri/target/${RUST_TARGET}/debug/libpoolpoker_lib.a"

            echo "Compiling offline Rust staticlib with custom-protocol for $RUST_TARGET..."
            if ! cargo build --package poolpoker --manifest-path "$SRCROOT/../src-tauri/Cargo.toml" --target "$RUST_TARGET" --features tauri/custom-protocol; then
              echo "error: [PoolPoker iOS] cargo build 编译 Rust 静态库失败 (target: ${RUST_TARGET})。请检查上方 Rust 报错日志。" >&2
              exit 1
            fi

            if [ ! -f "$CARGO_LIB" ]; then
              echo "error: [PoolPoker iOS] 编译未生成预期的静态库文件: $CARGO_LIB" >&2
              exit 1
            fi

            cp "$CARGO_LIB" "$TARGET_LIB"
            if [ "$RUST_TARGET" = "aarch64-apple-ios" ]; then
              mkdir -p "$SRCROOT/Externals/arm64/${CONFIGURATION}"
              cp "$CARGO_LIB" "$SRCROOT/Externals/arm64/${CONFIGURATION}/libapp.a"
            fi

            if [ ! -f "$TARGET_LIB" ]; then
              echo "error: [PoolPoker iOS] 未找到产物 $TARGET_LIB，编译异常中断。" >&2
              exit 1
            fi

            echo "Offline libapp.a is ready at $TARGET_LIB"
          fi
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  poolpoker_watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
        excludes: [Info.plist]
      - path: Shared
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: PoolPoker
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.poolpoker.app
        WKRunsIndependentlyOfCompanionApp: true
        NSLocationWhenInUseUsageDescription: 查找附近可加入的球霸扑克房间，不保存或公开精确位置。
        NSLocalNetworkUsageDescription: 连接局域网内的球霸扑克服务器。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: PoolPokerWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.poolpoker.app.watchkitapp
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=watchsimulator*]: Shared/Simulator.entitlements
        SUPPORTED_PLATFORMS: [watchos, watchsimulator]
        SKIP_INSTALL: true
    scheme: {}
