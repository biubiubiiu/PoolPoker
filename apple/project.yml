name: poolpoker
options:
  bundleIdPrefix: com.poolpoker.app
  deploymentTarget:
    iOS: 16.0
fileGroups: [../src]
configs:
  debug: debug
  release: release
configFiles:
  debug: Config.xcconfig
  release: Config.xcconfig
settingGroups:
  app:
    base:
      PRODUCT_NAME: PoolPoker
      PRODUCT_BUNDLE_IDENTIFIER: com.poolpoker.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  poolpoker_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared/RoomCredential.swift
      - path: Assets.xcassets
      - path: Externals
      - path: poolpoker_iOS
      - path: assets
        buildPhase: resources
        type: folder
    info:
      path: poolpoker_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackgroundColor
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: PoolPoker 需要访问局域网以连接开发服务器与游戏房间。
        NSBluetoothAlwaysUsageDescription: PoolPoker 需要使用蓝牙进行面对面离线卡牌对局与桌台扫描联机。
        NSBluetoothPeripheralUsageDescription: PoolPoker 需要使用蓝牙作为房主外设发起离线面对面对决。
        NSBonjourServices:
          - _http._tcp.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: TaoScene
                UISceneDelegateClassName: TaoSceneDelegate
    entitlements:
      path: poolpoker_iOS/poolpoker_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Shared/Simulator.entitlements
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/$(PLATFORM_NAME)/$(CONFIGURATION) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          NVMRC_VER=$(tr -d '[:space:]' < "$SRCROOT/../.nvmrc" 2>/dev/null || true)
          if [ -n "$NVMRC_VER" ] && [ -d "$HOME/.nvm/versions/node/v${NVMRC_VER#v}/bin" ]; then
            NVM_BIN="$HOME/.nvm/versions/node/v${NVMRC_VER#v}/bin"
          else
            NVM_BIN="$HOME/.nvm/versions/node/$(ls "$HOME/.nvm/versions/node" 2>/dev/null | tail -n 1)/bin"
          fi
          export PATH="$NVM_BIN:$HOME/Library/pnpm/bin:$HOME/.local/share/pnpm:$HOME/.cargo/bin:$PATH:/opt/homebrew/bin:/usr/local/bin"

          if [[ "${SDKROOT:-}" == *Simulator* ]] || [ "${PLATFORM_NAME:-}" = "iphonesimulator" ]; then
            RUST_TARGET="aarch64-apple-ios-sim"
          else
            RUST_TARGET="aarch64-apple-ios"
          fi

          TARGET_DIR="$SRCROOT/Externals/${PLATFORM_NAME}/${CONFIGURATION}"
          mkdir -p "$TARGET_DIR"

          if [ "${POOLPOKER_OFFLINE:-1}" = "0" ]; then
            echo "=== [PoolPoker] Mode: Live Dev Server (localhost:5173, target: $RUST_TARGET) ==="
            pnpm tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?} || {
              if [ -f "$TARGET_DIR/libapp.a" ] || [ -f "$SRCROOT/Externals/arm64/${CONFIGURATION}/libapp.a" ]; then
                echo "warning: Tauri CLI dev server is not running. Falling back to existing libapp.a static library."
                exit 0
              else
                echo "error: Tauri CLI dev server is not running and libapp.a missing. Please run 'pnpm exec tauri ios dev' first."
                exit 1
              fi
            }
          else
            echo "=== [PoolPoker] Mode: Offline Standalone (Embedded dist, target: $RUST_TARGET) ==="
            if [ ! -d "$SRCROOT/../dist" ] || [ "$SRCROOT/../src" -nt "$SRCROOT/../dist" ]; then
              echo "Building web frontend dist..."
              pnpm run build
            fi
            TARGET_LIB="$TARGET_DIR/libapp.a"
            CARGO_LIB="$SRCROOT/../src-tauri/target/${RUST_TARGET}/debug/libpoolpoker_lib.a"
            if [ ! -f "$TARGET_LIB" ] || [ "$SRCROOT/../src-tauri/src" -nt "$TARGET_LIB" ]; then
              echo "Compiling offline Rust staticlib with custom-protocol for $RUST_TARGET..."
              cargo build --package poolpoker --manifest-path "$SRCROOT/../src-tauri/Cargo.toml" --target "$RUST_TARGET" --features tauri/custom-protocol
              cp "$CARGO_LIB" "$TARGET_LIB"
              if [ "$RUST_TARGET" = "aarch64-apple-ios" ]; then
                mkdir -p "$SRCROOT/Externals/arm64/${CONFIGURATION}"
                cp "$CARGO_LIB" "$SRCROOT/Externals/arm64/${CONFIGURATION}/libapp.a"
              fi
            fi
            echo "Offline libapp.a is ready at $TARGET_LIB"
          fi
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  poolpoker_watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
        excludes: [Info.plist]
      - path: Shared
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: PoolPoker
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.poolpoker.app
        WKRunsIndependentlyOfCompanionApp: true
        NSLocationWhenInUseUsageDescription: 查找附近可加入的球霸扑克房间，不保存或公开精确位置。
        NSLocalNetworkUsageDescription: 连接局域网内的球霸扑克服务器。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: PoolPokerWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.poolpoker.app.watchkitapp
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=watchsimulator*]: Shared/Simulator.entitlements
        SUPPORTED_PLATFORMS: [watchos, watchsimulator]
        SKIP_INSTALL: true
    scheme: {}
