name: poolpoker
options:
  bundleIdPrefix: com.poolpoker.app
  deploymentTarget:
    iOS: 16.0
fileGroups: [../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: PoolPoker
      PRODUCT_BUNDLE_IDENTIFIER: com.poolpoker.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  poolpoker_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared/RoomCredential.swift
      - path: Assets.xcassets
      - path: Externals
      - path: poolpoker_iOS
      - path: assets
        buildPhase: resources
        type: folder
    info:
      path: poolpoker_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: PoolPoker 需要访问局域网以连接开发服务器与游戏房间。
        NSBonjourServices:
          - _http._tcp.
    entitlements:
      path: poolpoker_iOS/poolpoker_iOS.entitlements
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: Shared/Simulator.entitlements
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: poolpoker_watchOS
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$HOME/.local/share/pnpm:$HOME/.cargo/bin"
          if [ -f "$HOME/.zshrc" ]; then source "$HOME/.zshrc" 2>/dev/null || true; fi
          pnpm tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?} || {
            if [ -f "$SRCROOT/Externals/arm64/${CONFIGURATION}/libapp.a" ] || [ -f "$SRCROOT/Externals/x86_64/${CONFIGURATION}/libapp.a" ]; then
              echo "warning: Tauri CLI dev server is not running (Connection refused). Falling back to existing libapp.a static library."
              echo "warning: Run 'pnpm exec tauri ios dev' in terminal for full live reload support."
              exit 0
            else
              echo "error: Tauri CLI dev server is not running and libapp.a missing. Please run 'pnpm exec tauri ios dev' in terminal first."
              exit 1
            fi
          }
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a
  poolpoker_watchOS:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
        excludes: [Info.plist]
      - path: Shared
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: PoolPoker
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1.0.0"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.poolpoker.app
        WKRunsIndependentlyOfCompanionApp: true
        NSLocationWhenInUseUsageDescription: 查找附近可加入的球霸扑克房间，不保存或公开精确位置。
        NSLocalNetworkUsageDescription: 连接局域网内的球霸扑克服务器。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: PoolPokerWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.poolpoker.app.watchkitapp
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS[sdk=watchsimulator*]: Shared/Simulator.entitlements
        SKIP_INSTALL: true
    scheme: {}
