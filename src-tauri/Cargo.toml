[package]
name = "poolpoker"
version = "1.0.0"
description = "PoolPoker (球霸扑克) Mobile & Web Application"
authors = [""]
edition = "2021"

[lib]
name = "poolpoker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
