<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>PoolPoker</title>
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b4252" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
  </defs>
  <!-- Outer 8-Ball Circle (Transparent background outside circle) -->
  <circle cx="256" cy="256" r="236" fill="url(#ballGrad)" />
  <!-- Gloss reflection highlight -->
  <path d="M 120 180 A 180 180 0 0 1 340 100 A 200 200 0 0 0 120 180 Z" fill="#ffffff" opacity="0.18" />
  <!-- Inner White Circle -->
  <circle cx="256" cy="256" r="108" fill="#ffffff" />
  <!-- Number 8 -->
  <text x="256" y="302" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="140" text-anchor="middle" fill="#111827">8</text>
</svg>
