<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎱 设置机器人推送链接</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(1200px 800px at 50% -10%, #14532d, #052e16 60%, #02170c);
      color: #e5e7eb;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(6, 42, 24, 0.7);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 20px; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    h1 .icon { font-size: 26px; }
    .sub { font-size: 13px; color: #9ca3af; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 700; color: #a7f3d0; margin-bottom: 8px; }
    textarea, input[type="text"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #f3f4f6;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      transition: border-color .15s;
    }
    textarea:focus, input[type="text"]:focus { border-color: #10b981; }
    textarea { min-height: 88px; }
    .row { display: flex; gap: 10px; margin-top: 16px; }
    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .08s, filter .15s;
    }
    button:active { transform: scale(0.97); }
    .save { background: #10b981; color: #052e16; }
    .save:hover { filter: brightness(1.08); }
    .clear { background: rgba(255, 255, 255, 0.08); color: #e5e7eb; border: 1px solid rgba(255,255,255,0.12); }
    .clear:hover { filter: brightness(1.2); }
    .msg { margin-top: 16px; font-size: 13px; min-height: 20px; }
    .msg.ok { color: #34d399; }
    .msg.err { color: #f87171; }
    .hint { margin-top: 20px; font-size: 11px; color: #6b7280; line-height: 1.6; }
    .hint code { background: rgba(0,0,0,0.35); padding: 1px 6px; border-radius: 5px; color: #a7f3d0; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span class="icon">🎱</span> 机器人推送链接</h1>
    <p class="sub">每局胜利结算后，将房间号与积分推送到企业微信机器人。</p>

    <label for="url">Webhook 链接</label>
    <textarea id="url" placeholder="粘贴企业微信机器人的 Webhook 地址，例如 https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=..."></textarea>

    <div class="row">
      <button class="save" onclick="save()">保存</button>
      <button class="clear" onclick="clearUrl()">清除</button>
    </div>

    <div class="msg" id="msg"></div>

    <div class="hint">
      <p>• 保存后，有链接才会发送；清除或留空则不再推送。</p>
      <p>• 链接仅保存在服务内存中，服务重启后会清空。</p>
      <p>• 当前地址：<code id="current">加载中…</code></p>
    </div>
  </div>

  <script>
    const urlEl = document.getElementById('url');
    const msgEl = document.getElementById('msg');
    const currentEl = document.getElementById('current');

    function show(msg, ok) {
      msgEl.textContent = msg;
      msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    async function load() {
      try {
        const res = await fetch('/api/robot-url');
        const data = await res.json();
        urlEl.value = data.url || '';
        currentEl.textContent = data.url || '(未设置)';
      } catch (e) {
        show('加载失败：' + e.message, false);
      }
    }

    async function save() {
      const url = urlEl.value.trim();
      if (!url) { show('请先输入链接', false); return; }
      try {
        const res = await fetch('/api/robot-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (data.success) {
          currentEl.textContent = data.url;
          show('✅ 已保存，之后每局会推送结果', true);
        } else {
          show('保存失败', false);
        }
      } catch (e) {
        show('保存失败：' + e.message, false);
      }
    }

    async function clearUrl() {
      try {
        const res = await fetch('/api/robot-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: '' }),
        });
        const data = await res.json();
        if (data.success) {
          urlEl.value = '';
          currentEl.textContent = '(未设置)';
          show('已清除，之后不再推送', true);
        }
      } catch (e) {
        show('清除失败：' + e.message, false);
      }
    }

    load();
  </script>
</body>
</html>
